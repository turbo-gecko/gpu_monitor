[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-monitor"
version = "2.0.0"
description = "PySide6 NVIDIA GPU & system memory monitor (no sudo, Linux only)"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "qt-material>=2.14",
    "paho-mqtt>=2.0",
]

[project.scripts]
gpu-monitor = "gpu_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
