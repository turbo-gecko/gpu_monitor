[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-monitor"
version = "1.3.0"
description = "Tkinter NVIDIA GPU & system memory monitor (no sudo, Linux only)"
requires-python = ">=3.10"
dependencies = []  # standard library only (tkinter)

[project.scripts]
gpu-monitor = "gpu_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
